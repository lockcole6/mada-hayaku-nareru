ding-right:0}.page figcaption{padding:10px 14px}.controls{gap:6px;padding:10px 8px}.controls nav{gap:2px}.controls nav button{padding:7px 8px;min-width:27px}.controls .arrow{min-width:56px;padding:9px 8px;font-size:12px}#status{display:none}}@media print{body{background:white}header,.controls,.note,figcaption{display:none!important}.pages{padding:0}.page{display:block!important;break-after:page;margin:0;max-width:none}.page img{box-shadow:none}}

<main class="pages" id="pages"><figure class="page" id="page-1"><img src="page-01.png" alt="第4話 1ページ" width="1024" height="1536" loading="eager"><figcaption><span>1 / 8</span><a href="page-01.png" target="_blank" rel="noopener">1ページを大きく開く</a></figcaption></figure><figure class="page" id="page-2" hidden><img src="page-02.png" alt="第4話 2ページ" width="1024" height="1536" loading="lazy"><figcaption><span>2 / 8</span><a href="page-02.png" target="_blank" rel="noopener">2ページを大きく開く</a></figcaption></figure><figure class="page" id="page-3" hidden><img src="page-03.png" alt="第4話 3ページ" width="1024" height="1536" loading="lazy"><figcaption><span>3 / 8</span><a href="page-03.png" target="_blank" rel="noopener">3ページを大きく開く</a></figcaption></figure><figure class="page" id="page-4" hidden><img src="page-04.png" alt="第4話 4ページ" width="1024" height="1536" loading="lazy"><figcaption><span>4 / 8</span><a href="page-04.png" target="_blank" rel="noopener">4ページを大きく開く</a></figcaption></figure><figure class="page" id="page-5" hidden><img src="page-05.png" alt="第4話 5ページ" width="1024" height="1536" loading="lazy"><figcaption><span>5 / 8</span><a href="page-05.png" target="_blank" rel="noopener">5ページを大きく開く</a></figcaption></figure><figure class="page" id="page-6" hidden><img src="page-06.png" alt="第4話 6ページ" width="1024" height="1536" loading="lazy"><figcaption><span>6 / 8</span><a href="page-06.png" target="_blank" rel="noopener">6ページを大きく開く</a></figcaption></figure><figure class="page" id="page-7" hidden><img src="page-07.png" alt="第4話 7ページ" width="1024" height="1536" loading="lazy"><figcaption><span>7 / 8</span><a href="page-07.png" target="_blank" rel="noopener">7ページを大きく開く</a></figcaption></figure><figure class="page" id="page-8" hidden><img src="page-08.png" alt="第4話 8ページ" width="1024" height="1536" loading="lazy"><figcaption><span>8 / 8</span><a href="page-08.png" target="_blank" rel="noopener">8ページを大きく開く</a></figcaption></figure></main>

<footer class="controls"><button id="next" class="arrow" aria-label="次のページ">← 次へ</button><nav aria-label="ページを選ぶ"><button data-page="1" aria-label="1ページ" aria-pressed="true">1</button><button data-page="2" aria-label="2ページ" aria-pressed="false">2</button><button data-page="3" aria-label="3ページ" aria-pressed="false">3</button><button data-page="4" aria-label="4ページ" aria-pressed="false">4</button><button data-page="5" aria-label="5ページ" aria-pressed="false">5</button><button data-page="6" aria-label="6ページ" aria-pressed="false">6</button><button data-page="7" aria-label="7ページ" aria-pressed="false">7</button><button data-page="8" aria-label="8ページ" aria-pressed="false">8</button></nav><span id="status" aria-live="polite">1 / 8</span><button id="prev" class="arrow" disabled aria-label="前のページ">前へ →</button></footer>
<script>
let current=Math.max(1,Math.min(8,parseInt(location.hash.replace("#page-",""))||1)),all=false;
const figures=[...document.querySelectorAll(".page")],nums=[...document.querySelectorAll("[data-page]")];
function render(scroll=false){figures.forEach((f,i)=>f.hidden=!all&&i!==current-1);nums.forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.page)===current)));document.getElementById("status").textContent=current+" / 8";document.getElementById("prev").disabled=current===1;document.getElementById("next").disabled=current===8;document.getElementById("single").setAttribute("aria-pressed",String(!all));document.getElementById("continuous").setAttribute("aria-pressed",String(all));if(scroll){if(all)figures[current-1].scrollIntoView({behavior:"instant"});else window.scrollTo(0,0)}}
function go(n){current=Math.max(1,Math.min(8,n));history.replaceState(null,"","#page-"+current);render(true)}
nums.forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.page))));
document.getElementById("next").addEventListener("click",()=>go(current+1));document.getElementById("prev").addEventListener("click",()=>go(current-1));
document.getElementById("single").addEventListener("click",()=>{all=false;render(true)});document.getElementById("continuous").addEventListener("click",()=>{all=true;render(true)});
window.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowLeft"){e.preventDefault();go(current+1)}if(e.key==="ArrowRight"){e.preventDefault();go(current-1)}});
window.addEventListener("hashchange",()=>{current=Math.max(1,Math.min(8,parseInt(location.hash.replace("#page-",""))||1));render(true)});render();
</script></body></html>
